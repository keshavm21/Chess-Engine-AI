# Tool configuration only. The project is not packaged or installed; run
# everything from the repository root.
# Supported Python versions: 3.10-3.13 (pygame 2.6 has no wheels for 3.14 yet).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
xfail_strict = true
markers = [
    "slow: long-running tests such as deep perft (deselect with -m \"not slow\")",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Existing issues in the legacy modules. They are removed in Phase 2 of
# docs/improvement-plan (wildcard imports, sys.path hacks, unused code), at
# which point these ignores must be deleted.
"chess_ai/gui.py" = ["F401", "F403", "F405"]
"chess_ai/search.py" = ["F401", "F841"]
