# Tool configuration only. The project is not packaged or installed; run
# everything from the repository root.
# Supported Python versions: 3.10-3.13 (pygame 2.6 has no wheels for 3.14 yet).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
xfail_strict = true
markers = [
    "slow: long-running tests such as deep perft (deselect with -m \"not slow\")",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# E/F: pycodestyle errors and pyflakes; I: import order; N: PEP 8 naming, which
# keeps the snake_case / UPPER_CASE / CapWords conventions from drifting.
select = ["E4", "E7", "E9", "F", "I", "N"]
